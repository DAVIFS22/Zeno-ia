name: Zeno IA Automatic Release & Review

on:
  push:
    branches:
      - main
    # Avoid triggering on the bot's own tag pushes
    tags-ignore:
      - 'v*'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forçar publicação imediata (ignorar contagem de 10 commits ou 7 dias)'
        required: false
        type: boolean
        default: true

jobs:
  automatic_release_review:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run AI Release Review & Version Analyzer
        id: analyzer
        run: |
          npx tsx scripts/githubReleaseAnalyzer.ts
          if git diff --quiet src/config/versionConfig.ts; then
            echo "new_release=false" >> $GITHUB_OUTPUT
            echo "[INFO] Nenhuma release gerada nesta execução (condições de 10 commits ou 7 dias não atingidas, ou sem alterações relevantes)."
          else
            echo "new_release=true" >> $GITHUB_OUTPUT
            echo "[INFO] Nova versão gerada e qualificada para publicação."
          fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_RELEASE: ${{ github.event.inputs.force }}
          EVENT_NAME: ${{ github.event_name }}

      - name: Build Application
        if: steps.analyzer.outputs.new_release == 'true'
        run: npm run build
        env:
          NODE_ENV: production
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Configure Git Identity
        if: steps.analyzer.outputs.new_release == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit Version Bump & Summarized Changelog
        if: steps.analyzer.outputs.new_release == 'true'
        run: |
          git add src/config/versionConfig.ts public/changelog.json public/release_notes.md
          git commit -m "chore(release): automatic version bump & summarized review [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main || true

      - name: Get Latest Version Tag
        if: steps.analyzer.outputs.new_release == 'true'
        id: version
        run: |
          VERSION=$(grep "export const CURRENT_ZENO_VERSION =" src/config/versionConfig.ts | cut -d'"' -f2)
          if [ -z "$VERSION" ]; then
            echo "[ERROR] Could not extract version from src/config/versionConfig.ts"
            exit 1
          fi
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "[INFO] Extracted version: $VERSION"

      - name: Create Git Tag
        if: steps.analyzer.outputs.new_release == 'true'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git tag -a "$TAG" -m "Zeno IA Release $TAG (Automated Review)"
          git push origin "$TAG" || true

      - name: Create GitHub Release with Summarized Points
        if: steps.analyzer.outputs.new_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Zeno IA ${{ steps.version.outputs.tag }}
          body_path: public/release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Firebase Hosting
        if: steps.analyzer.outputs.new_release == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: ai-studio-zenoai-6c7f4f97-880f-4ba1-a9e6-577dff385aa7
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels
